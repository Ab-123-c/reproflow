name: ReproFlow capsules

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-capsules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ReproFlow
        run: python -m pip install -e ".[dev]"
      - name: Validate every capsule
        run: reproflow list . --json > reproflow-capsules.json
      - name: Verify every capsule in Docker
        run: reproflow verify-all . --repo . --json | tee reproflow-verification.json
      - name: Upload ReproFlow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproflow-evidence
          path: |
            reproflow-capsules.json
            reproflow-verification.json
