name: ReproFlow issue evidence

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_url:
        description: GitHub Issue URL to reproduce
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ReproFlow
        run: python -m pip install -e ".[ai]"
      - name: Reproduce issue
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_URL: ${{ github.event.issue.html_url || inputs.issue_url }}
        run: |
          set +e
          reproflow reproduce --repo . --issue "$ISSUE_URL" --output .repro/github-issue --json > reproflow-result.json
          echo "REPROFLOW_EXIT=$?" >> "$GITHUB_ENV"
          exit 0
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproflow-issue-evidence
          path: .repro/github-issue
          if-no-files-found: ignore
      - name: Comment on issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' > /tmp/reproflow-comment.md
          import json
          from pathlib import Path
          try:
              data = json.loads(Path("reproflow-result.json").read_text())
          except Exception as exc:
              data = {"status": "ERROR", "error": str(exc)}
          status = data.get("status", "ERROR")
          if status == "VERIFIED":
              body = "✅ ReproFlow verified this issue. Evidence is attached to this workflow run."
          elif status == "NEEDS_INFORMATION":
              body = "ℹ️ ReproFlow needs more information to build a deterministic reproduction. See the workflow logs."
          else:
              body = f"⚠️ ReproFlow could not verify this issue (`{status}`). Evidence and diagnostics are attached to this workflow run."
          print(body)
          PY
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/reproflow-comment.md
